name: Riyad Opportunities QA

on:
  push:
    branches:
      - codex/audit-repair-20261009-0851
      - main
    paths:
      - 'riyad-opportunities/**'
      - '.github/workflows/riyad-opportunities-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, '[live-smoke-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full site QA
        working-directory: riyad-opportunities
        run: sh qa/run.sh

  browser:
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, '[live-smoke-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/riyad-browser" --no-save playwright@1.55.0
          "$RUNNER_TEMP/riyad-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise desktop and mobile browser interactions
        run: NODE_PATH="$RUNNER_TEMP/riyad-browser/node_modules" node riyad-opportunities/qa/qa-browser.js

  live-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the published GitHub Pages site
        run: node riyad-opportunities/qa/qa-live-site.js
