name: Riyad Opportunities QA

on:
  push:
    branches:
      - qa/candidate-live-findings-20261028
      - fix/complete-directory-scope-20261027
      - codex/audit-repair-20261009-0851
      - codex/fix-independent-sector-selection-20261009
      - audit/general-city-nhc-20261010
      - fix/scope-counts-nhc-20261010
      - fix/live-office-maps-20261014
      - fix/rakez-headquarters-20261014
      - fix/national-company-sector-policy-20261014
      - fix/verified-office-release-20261014
      - feat/approved-portal-redesign-20261016
      - main
    paths:
      - 'riyad-opportunities/**'
      - '.github/workflows/riyad-opportunities-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, '[live-smoke-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full site QA
        working-directory: riyad-opportunities
        run: sh qa/run.sh

  browser:
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, '[live-smoke-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/riyad-browser" --no-save playwright@1.55.0
          "$RUNNER_TEMP/riyad-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise desktop and mobile browser interactions
        run: NODE_PATH="$RUNNER_TEMP/riyad-browser/node_modules" node riyad-opportunities/qa/qa-browser.js
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-browser-qa-${{ github.sha }}
          path: riyad-opportunities/qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

  live-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the published GitHub Pages site
        run: node riyad-opportunities/qa/qa-live-site.js


  webkit-candidate:
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, '[live-smoke-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit compatibility runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/webkit-browser" --no-save playwright@1.55.0
          "$RUNNER_TEMP/webkit-browser/node_modules/.bin/playwright" install --with-deps webkit
      - name: Exercise final candidate with WebKit (not a physical iPhone)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory riyad-opportunities > "$RUNNER_TEMP/webkit-local-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 20); do curl -fsSo /dev/null http://127.0.0.1:8765/index.html && break || sleep 0.2; done
          QA_BASE_URL=http://127.0.0.1:8765/ NODE_PATH="$RUNNER_TEMP/webkit-browser/node_modules" node riyad-opportunities/qa/qa-live-webkit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-webkit-${{ github.sha }}
          path: riyad-opportunities/qa-webkit-artifacts/
          retention-days: 14

  geographic-semantics:
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, '[live-smoke-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install independent browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/semantic-browser" --no-save playwright@1.55.0
          "$RUNNER_TEMP/semantic-browser/node_modules/.bin/playwright" install --with-deps ${{ matrix.engine }}
      - name: Check independent geographic and showroom contracts
        run: |
          mkdir -p riyad-opportunities/semantic-artifacts
          node riyad-opportunities/qa/semantic/geography-data-contract.js riyad-opportunities riyad-opportunities/semantic-artifacts/geography-${{ matrix.engine }}.json
          node riyad-opportunities/qa/semantic/semantic-contract.js riyad-opportunities riyad-opportunities/semantic-artifacts/offline-${{ matrix.engine }}.json
          SEMANTIC_BROWSER=${{ matrix.engine }} NODE_PATH="$RUNNER_TEMP/semantic-browser/node_modules" node riyad-opportunities/qa/semantic/browser-semantic-contract.js riyad-opportunities riyad-opportunities/semantic-artifacts/browser-${{ matrix.engine }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geographic-semantics-${{ matrix.engine }}-${{ github.sha }}
          path: riyad-opportunities/semantic-artifacts/
          retention-days: 14
