<!doctype html>
<html lang="ar" dir="rtl" data-release="20261114T102435">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>حاسبة التمويل</title>
<link rel="stylesheet" href="style.css?v=6df640411b3b5435">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=riyad1">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=riyad1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#230871">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حاسبة التمويل">
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="wordmark" href="./">حاسبة التمويل<span class="brand-line"></span></a></div></header>
<main class="app-shell">
<section class="panel identity-panel" id="identityPanel"><div class="client-toolbar"><h1>بيانات الحسبة</h1></div><div class="identity-grid"><label>مسؤول المبيعات<input id="advisor" value="خالد الماطر" maxlength="100"></label><label>رقم الجوال<input id="phone" type="tel" maxlength="30" inputmode="numeric" data-number="integer" dir="ltr" lang="en"></label><label>اسم العميل<input id="clientName" maxlength="100"></label></div>
<button type="button" id="startCalculation" disabled class="primary-button start-calculation">اذهب للاحتساب ←</button></section><section id="calculationPage" hidden><nav class="product-nav" aria-label="التمويل"><button type="button" data-product="personal" aria-pressed="true">الشخصي</button><button type="button" data-product="fixed" aria-pressed="false">العقاري الثابت</button><button type="button" data-product="flex" aria-pressed="false">العقاري المرن</button><button type="button" data-product="manual" aria-pressed="false">تقرير دفعات</button></nav>
<div class="calculator-grid"><div class="entry-column">
<section class="panel client-panel">
<div class="panel-heading"><h1>بيانات العميل</h1></div>
<div class="segmented personal-products" id="personalProductOptions"><button type="button" data-personal-kind="new" aria-pressed="false">شخصي جديد<small class="product-rate" hidden></small></button><button type="button" data-personal-kind="buyout" aria-pressed="false">شراء مديونية<small class="product-rate" hidden></small></button><button type="button" data-personal-kind="refinance" aria-pressed="false">إعادة تمويل<small class="product-rate" hidden></small></button></div><div class="client-grid">
<label><span id="salaryLabel">الراتب</span><input id="salary" type="text" min=".01" step=".01" inputmode="decimal" data-number="decimal" dir="ltr" lang="en" autocomplete="off"></label>
<label>تاريخ الميلاد الهجري<input id="birth" class="hijri-input" placeholder="‎يوم‎ - ‎شهر‎ - ‎سنة‎" maxlength="10" type="text" inputmode="numeric" dir="ltr" autocomplete="off" aria-describedby="birthError" lang="en"><span id="birthError" class="field-error" role="alert" hidden></span></label>
<label>جهة العمل<select id="sector"><option value="civil">حكومي</option><option value="military">عسكري</option><option value="retired">متقاعد</option><option value="privateA">قطاع خاص · فئة A</option><option value="privateB">قطاع خاص · فئة B</option><option value="privateC">قطاع خاص · فئة C</option><option value="corporation">الشركات الكبرى / شبه الحكومي</option><option value="bank">موظف بنك</option><option value="unapproved">موظف غير معتمد</option></select></label>
<label id="personalTermField">مدة التمويل بالأشهر<input id="personalTerm" type="text" min="1" max="60" step="1" value="60" inputmode="numeric" data-number="integer" dir="ltr" lang="en" autocomplete="off"></label><label id="supportStatusField" hidden>الدعم<select id="supportStatus"><option value="">اختر</option><option value="supported">مدعوم</option><option value="none">غير مدعوم</option></select></label><label id="rateField"><span class="rate-heading"><span id="rateTitle">النسبة السنوية % <small id="rateProduct"></small></span><span class="rate-mode"><input id="manualRate" type="checkbox">تعديل النسبة يدويًا</span></span><input id="rate" type="text" min="0" step=".01" inputmode="decimal" data-number="decimal" dir="ltr" lang="en" autocomplete="off"></label>
<label id="rankField" class="full" hidden>الرتبة الحالية<select id="rank"></select></label>
<label id="pilotField" class="checkbox full" hidden><input id="pilot" type="checkbox">ضابط طيار</label>
</div>
</section>
<section class="panel personal-product-panel" id="personalProductPanel"><label id="settlementField" hidden><span id="settlementLabel">إجمالي مديونية البنك الآخر</span><input id="settlement" type="text" min="0" step=".01" inputmode="decimal" data-number="decimal" dir="ltr" lang="en" autocomplete="off"></label></section>
<section class="panel commitments-panel" id="commitmentsPanel">
<div class="panel-heading"><h2>الالتزامات الحالية</h2><button id="addDebt" class="text-button" type="button">إضافة</button></div>
<div id="personalCommitment" class="personal-commitment" hidden><div><span>الشخصي المحتسب</span><strong id="personalCommitmentAmount"></strong></div><span id="personalCommitmentTerm"></span><label class="switch-label"><input id="includePersonal" type="checkbox" checked><span>احتساب</span></label></div>
<label class="toggle-line"><span>قسط شخصي قائم</span><input id="existingPersonal" type="checkbox" role="switch"></label><div class="config-grid" id="existingFields" hidden><label>القسط<input id="existingPayment" type="text" min="0" step=".01" inputmode="decimal" data-number="decimal" dir="ltr" lang="en" autocomplete="off"></label><label>المدة المتبقية بالأشهر<input id="existingMonths" type="text" min="1" step="1" inputmode="numeric" data-number="integer" dir="ltr" lang="en" autocomplete="off"></label></div>

<div id="debts"></div>
<div class="credit-field"><label class="toggle-line"><span>بطاقات ائتمانية</span><input id="hasCards" type="checkbox" role="switch"></label><label id="creditEntry" hidden>الحد الائتماني للبطاقات<input id="credit" type="text" min="0" step=".01" inputmode="decimal" data-number="decimal" dir="ltr" lang="en" autocomplete="off"></label><output id="creditOutput" hidden></output></div>
</section>
<section class="panel mortgage-config" id="mortgageConfig" hidden>
<h2 class="config-title">نوع التمويل</h2>
<div class="property-tabs" aria-label="نوع العقار"><button type="button" data-property="ready" aria-pressed="true">شراء جاهز</button><button type="button" data-property="offplan" aria-pressed="false">بيع على الخارطة</button><button type="button" data-property="self" aria-pressed="false">بناء ذاتي</button><button type="button" data-property="lien" aria-pressed="false">رهن عقاري</button></div>
<div class="config-grid">
<label id="retirementField">خيار التمويل<select id="retirement"><option value="before">حتى التقاعد</option><option value="after">بعد التقاعد</option></select></label>
<label id="supportKindField">نوع الدعم<select id="support"><option value="monthly">دعم شهري</option><option value="package">باقة الدفعة المقدمة</option></select></label>
</div>
<label class="toggle-line" id="packageField" hidden><span>سبق استلام باقة الدفعة المقدمة</span><input id="packageReceived" type="checkbox" role="switch"></label>
<div class="config-grid duration-inputs"><label class="duration-years">مدة التمويل<select id="termYears"><option value="">المدة القصوى</option></select></label><label>المدة بالأشهر<input id="term" type="text" min="1" max="360" inputmode="numeric" data-number="integer" dir="ltr" lang="en" autocomplete="off"></label></div><p id="durationSummary" class="duration-breakdown" hidden></p>
<label class="property-value"><span><span id="propertyValueLabel">سعر العقار / الوحدة</span> <small>〔اختياري〕</small></span><input id="propertyValue" type="text" inputmode="decimal" data-number="decimal" dir="ltr" lang="en" autocomplete="off"></label>
<p id="lienRule" class="lien-rule" hidden>تمويل البنك حتى 80% من القيمة السوقية للعقار</p><div id="downPaymentBreakdown" class="config-grid down-payment-breakdown" hidden><label id="packageBreakdownField">دعم الدفعة المقدمة<output id="packageBreakdownValue"></output></label><label><span id="clientDownPaymentLabel">الدفعة المقدمة من العميل</span><output id="clientDownPaymentValue"></output></label></div><div id="fundingExplanation" class="funding-explanation" role="note" hidden></div><label id="extraDownPaymentField" class="extra-down-payment" hidden><span>دفعة مقدمة إضافية من العميل <small>〔اختياري〕</small></span><input id="extraDownPayment" type="text" inputmode="decimal" data-number="decimal" dir="ltr" lang="en" autocomplete="off"></label>
<div class="retirement-fields config-grid" id="retirementFields" hidden><label>الراتب الأساسي<input id="basic" type="text" min=".01" step=".01" inputmode="decimal" data-number="decimal" dir="ltr" lang="en" autocomplete="off"></label><label>تاريخ التعيين الهجري<input id="hire" class="hijri-input" maxlength="10" inputmode="numeric" type="text" dir="ltr" lang="en"></label><label>الراتب المتوقع بعد التقاعد<output id="pension">—</output></label></div>
<div id="offplanFields" class="subfields" hidden><label class="toggle-line"><span>قسط ميسر خلال فترة الإنشاء (اختياري)</span><input id="useConstruction" type="checkbox" role="switch"></label><div id="constructionFields" class="config-grid" hidden><label>فترة الإنشاء بالأشهر<input id="buildMonths" type="text" inputmode="numeric" data-number="integer" dir="ltr" lang="en" autocomplete="off"></label><label>القسط الميسر خلال فترة الإنشاء<input id="constructionPayment" type="text" inputmode="decimal" data-number="decimal" dir="ltr" lang="en" autocomplete="off" placeholder="مثال: 400 أو 500"></label></div></div>
</section>
<section class="panel manual-panel" id="manualPanel" hidden>
<div class="panel-heading"><h1>تقرير الدفعات</h1><button type="button" class="text-button" id="addManual">إضافة دفعة</button></div><label class="manual-client-name">اسم العميل<input id="manualClientName" maxlength="100"></label><div class="segmented draw-modes"><button type="button" data-draw-mode="approval" aria-pressed="true">دفعات الموافقة</button><button type="button" data-draw-mode="manual" aria-pressed="false">إدخال الدفعات يدويًا</button></div><label id="approvalField">مبلغ الموافقة<input id="approvalAmount" type="text" min=".01" step=".01" inputmode="decimal" data-number="decimal" dir="ltr" lang="en" autocomplete="off"></label><div id="manualTotals" class="config-grid" hidden><label>إجمالي مبلغ التمويل<input id="manualTotalAmount" type="text" min="0" step=".01" inputmode="decimal" data-number="decimal" dir="ltr" lang="en" autocomplete="off"></label><label>إجمالي الأرباح<input id="manualTotalProfit" type="text" min="0" step=".01" inputmode="decimal" data-number="decimal" dir="ltr" lang="en" autocomplete="off"></label></div><div id="manualRows" hidden></div><div class="manual-share-actions"><button type="button" id="manualShare" class="primary-button" disabled>مشاركة الملف / تنزيل</button></div>
</section>
<section class="panel adjust-panel" id="methodPanel" hidden>
<div class="segmented" id="methodControls"><button data-method="max" type="button" aria-pressed="true">الحد الأعلى</button><button data-method="payment" type="button" aria-pressed="false">حسب القسط</button><button data-method="amount" type="button" aria-pressed="false">حسب المبلغ</button></div>
<label id="requestField" hidden><span id="requestLabel"></span><input id="request" type="text" min=".01" step=".01" inputmode="decimal" data-number="decimal" dir="ltr" lang="en" autocomplete="off"></label>
</section>
<section class="panel adjust-panel" id="adjustPanel" hidden>
<div id="reportControls" class="report-controls">
<div id="rateError" class="validation rate-error" role="status" hidden></div>
<h3 class="report-section-title">تعديل نسبة الاستقطاع</h3>
<output id="firstRate" hidden>—</output>
<div id="secondAdjust" hidden><label><span id="secondTitle">تعديل نسبة استقطاع الفترة الثانية</span><span class="deduction-input"><input id="secondRate" type="text" inputmode="decimal" dir="ltr" lang="en" autocomplete="off" data-percentage aria-describedby="secondLabel"><b>%</b></span></label><span id="secondLabel" hidden></span><output id="secondRateValue" hidden></output></div>
<div id="afterAdjust" hidden><label><span id="afterTitle">تعديل نسبة استقطاع الفترة الثالثة</span><span class="deduction-input"><input id="afterRate" type="text" inputmode="decimal" dir="ltr" lang="en" autocomplete="off" data-percentage aria-describedby="afterLabel"><b>%</b></span></label><span id="afterLabel" hidden></span><output id="afterRateValue" hidden></output></div>
<button type="button" id="resetSecond" class="text-button">إعادة احتساب الحد الأعلى</button></div></section>
</div>
</div>
<div class="validation" id="message" role="status" hidden></div>
<section class="panel result-panel" id="resultPanel" hidden>
<div id="report" aria-live="polite"></div><p id="settlementHint" class="settlement-hint" role="status" hidden></p><div class="report-toolbar"><button type="button" id="newClient" class="new-client"><span>＋</span> عميل جديد</button><button type="button" id="prepareShare" class="report-share-button">مشاركة الملف / تنزيل<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-4 4 4-4 4 4M5 12v8h14v-8"/></svg></button></div>

</section>
</section></main><div id="quickResult" class="quick-result" hidden><div><span id="quickLabel">التمويل</span><strong id="quickAmount"></strong></div><div><span>المدة</span><strong id="quickMonths"></strong></div><button id="viewResult" type="button">عرض الحسبة <span>←</span></button></div><dialog id="sharingDialog"><div class="panel-heading"><h2>مشاركة الملف</h2><button type="button" id="closeSharing" class="text-button">إغلاق</button></div><label>الملاحظات<textarea id="notes" rows="5" maxlength="4000"></textarea></label><div class="result-actions"><a id="openPdf" hidden target="_blank" rel="noopener">فتح PDF</a><button type="button" id="sharePdf" class="secondary-button" hidden>مشاركة التقرير</button><button type="button" class="primary-button" id="download">تنزيل PDF<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5"/></svg></button></div></dialog>
<footer class="site-footer">إعداد خالد الماطر</footer>
<script type="module" src="app.mjs?v=db60f88891016dfc"></script>
<div id="keyboardBar" class="keyboard-bar" hidden><button id="keyboardDone" type="button">تم ✓</button></div></body></html>
