<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>الصفحة غير موجودة — دليل فرص المملكة</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ecf8f7; color: #2b256c; font-family: "Noto Sans Arabic", Tahoma, sans-serif; text-align: center; padding: 16px; }
  a { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 10px; background: #2b256c; color: #fff; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>الصفحة غير موجودة</h1>
  <p>الرابط غير صحيح أو تغيّر.</p>
  <a href="./">العودة إلى الدليل</a>
</main>
<script>
  // الروابط المباشرة للفروع تستخدم # فلا تصل هنا؛ هذا للمسارات الخاطئة فقط
  (function () { var a = document.querySelector('a'); var parts = location.pathname.split('/').filter(Boolean); if (parts.length > 1 && location.hostname.endsWith('github.io')) a.href = '/' + parts[0] + '/'; })();
</script>
</body>
</html>
